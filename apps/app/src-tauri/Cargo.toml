[package]
name = "cherit"
version = "0.0.1"
description = "A WSYIWYG Markdown Editor Inspired by Obsidian"
authors = ["keshav-writes-code"]
license = "GPL-2.0"
repository = "https://github.com/Keshav-writes-code/Cherit"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
tauri-plugin-android-fs = { version = "24", features = [
  "legacy_storage_permission",
] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.8.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
urlencoding = "2"
natord = "1.0.9"
tauri-plugin-opener = "2"
tauri-plugin-safe-area-insets-css = "0.2"
tauri-plugin-clipboard-manager = "2"
futures = "0.3"
rayon = "1.8"
hf-hub = { version = "0.5.0", default-features = false, features = [
  "tokio",
  "rustls-tls",
] }
tauri-plugin-llm = { git = "https://github.com/crabnebula-dev/tauri-plugin-llm" }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true        # Enables link-time-optimizations.
opt-level = "s"   # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort"   # Higher performance by disabling panic handlers.
strip = true      # Ensures debug symbols are removed.
